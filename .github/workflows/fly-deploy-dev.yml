# Deploiement du backend de TEST (app Fly yaammoo-backend-dev, base de test).
# Actions -> "Deploy Fly DEV" -> Run workflow, branche `dev` UNIQUEMENT.
# Secret requis : FLY_API_TOKEN_DEV, jeton de deploiement limite a l'app de
# test (fly tokens create deploy -a yaammoo-backend-dev) : il ne peut pas
# toucher la prod.
# Machine toujours en auto-stop (fly.dev.toml).
name: Deploy Fly DEV

on:
  workflow_dispatch:

concurrency:
  group: fly-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verrou branche dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Deploy DEV refuse : lancer le workflow depuis dev (branche actuelle : ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --config fly.dev.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
